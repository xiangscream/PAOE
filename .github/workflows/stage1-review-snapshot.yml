name: Stage-one review snapshot
on:
  pull_request:
permissions:
  contents: read
jobs:
  snapshot:
    if: github.head_ref == 'codex/paoe-stage1-workflow-entry-20261102'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive committed sources only
        run: git archive --format=zip --output=stage1-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: stage1-committed-source
          path: stage1-source.zip
          retention-days: 1
