name: Stage-one candidate edit
on:
  push:
    branches: [codex/paoe-stage1-workflow-entry-20261102]
permissions:
  contents: write
jobs:
  edit:
    if: github.repository == 'xiangscream/PAOS-portable'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Apply the reviewed narrow entry changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          scripts = Path('code/personal-agent-os/scripts')
          source = scripts / 'paos_workstation.py'
          raw = source.read_bytes()
          # Edit only the inspected baseline; do not patch an unknown revision.
          import subprocess
          blob = subprocess.check_output(['git', 'hash-object', str(source)], text=True).strip()
          if blob != '09115e094975b546db58babf293634a87311d11b':
              raise SystemExit('Unexpected workstation source; stop before edits')
          text = raw.decode('utf-8')
          start = text.index('def render_fixed_entry(')
          end = text.index('\n\ndef render_initial_todo(', start)
          replacement = '''def render_fixed_entry(
              *,
              project: dict[str, Any],
              session: dict[str, Any],
              workstation_path: Path,
              workflow_library: str = "",
              skill_library: str = "",
              guide_ref: str = "",
              ops_ref: str = "",
              workflow_index_ref: str = "",
              skill_index_ref: str = "",
              tool_index_ref: str = "",
              staff_number: str = "",
              installation_file: str = "",
              source_root: str = "",
          ) -> str:
              """Render identity and real locators; shared guides own work behavior."""
              import shlex
              import sys

              project_id = _single_line(project.get("id"))
              agent_id = _single_line(session.get("id"))
              project_root = workstation_path.parent.parent
              workflow_root = str(workflow_library).strip()
              skill_root = str(skill_library).strip()

              def under(root: str, *parts: str) -> str:
                  return str(Path(root).joinpath(*parts)) if root else ""

              def link(label: str, value: str, fragment: str = "") -> str:
                  locator = str(value).strip()
                  if not locator:
                      return "（未登记）"
                  readable, problem = _readable_locator(locator)
                  # Angle destinations preserve spaces; keep the actual locator
                  # visible rather than replacing it with another path index.
                  destination = locator.replace("\\\\", "/") + fragment
                  return f"[{label}](<{destination}>)" + ("" if readable else problem)

              cycle = under(workflow_root, "Workflows", "wf-agent-work-cycle.md")
              guide = guide_ref or under(workflow_root, "Guides", "guide-work-method.md")
              ops = ops_ref or under(workflow_root, "Guides", "ops-entry.md")
              workflow_index = workflow_index_ref or under(workflow_root, "CATALOG.md")
              skill_index = skill_index_ref or under(skill_root, "CATALOG.md")
              lines = [
                  f"# Agent Workstation — {agent_id}" + (f" · 员工号 {staff_number}" if staff_number else ""),
                  "", "## 身份", "",
                  f"- Project：{project_id}",
                  f"- Agent：{agent_id}",
                  f"- 工位：{workstation_path}",
                  "", "## 当前工作与项目", "",
                  "- 当前行动：[TODO](TODO.md)",
                  f"- 项目入口：{link('INDEX', str(project_root / 'INDEX.md'))}",
                  f"- 本人规则：{link('AGENTS', str(workstation_path / 'AGENTS.md'))}",
                  f"- 项目规则：{link('Project AGENTS', str(project_root / 'AGENTS.md'))}",
                  f"- 同事与职责：{link('TEAM', str(project_root / 'TEAM.md'))}",
                  "- 持久输入：mailbox/、notices/", "",
                  "## 安装与共享入口", "",
                  f"- 安装描述：{str(installation_file).strip() or '（未登记）'}",
              ]
              if installation_file and source_root:
                  cli = Path(posix_windows_drive_locator(str(source_root))) / "scripts" / "paos.py"
                  argv = [sys.executable, "-X", "utf8", str(cli), "--installation-file",
                          posix_windows_drive_locator(str(installation_file))]
                  if os.name == "nt":
                      command = "& " + " ".join("'" + value.replace("'", "''") + "'" for value in argv)
                      language = "powershell"
                  else:
                      command, language = shlex.join(argv), "sh"
                  lines += ["- CLI：" + ("" if cli.is_file() else "（已登记但当前文件不可读）"),
                            "", f"```{language}", command, "```", ""]
              else:
                  lines += ["- CLI：（未登记；从当前安装取得 Source 与 installation-file，不猜路径）", ""]
              lines += [
                  f"- 通用工作正文：{link('Agent 工作循环', cycle)}",
                  f"- 恢复入口：{link('恢复', cycle, '#恢复')}",
                  f"- 按任务找方法：{link('GUIDE', guide)}",
                  f"- 按目的找操作：{link('OPS', ops)}",
                  f"- Workflow 目录：{link('Catalog', workflow_index)}",
                  f"- Skill 目录：{link('Catalog', skill_index)}",
                  f"- Tool 目录：{link('Tool Index', tool_index_ref)}", "",
              ]
              return "\\n".join(lines)
          '''
          text = text[:start] + replacement + text[end:]
          old = '''    next_action = (
                  "读取 ENTRY / GUIDE / OPS，运行 orient 与 inbox 核对当前责任和输入，"
                  f"然后开始执行：{goal}"
              )'''
          new = '''    next_action = f"读取 ENTRY 的恢复入口，确认原输入后推进：{goal}"'''
          if text.count(old) != 1:
              raise SystemExit('Initial TODO edit anchor mismatch')
          text = text.replace(old, new, 1)
          start = text.index('def ensure_fixed_workstation(')
          tail = text[start:]
          old = '    staff_number: str = "",\n) -> dict[str, Any]:'
          new = '    staff_number: str = "",\n    installation_file: str = "",\n    source_root: str = "",\n) -> dict[str, Any]:'
          if tail.count(old) != 1:
              raise SystemExit('Workstation signature anchor mismatch')
          tail = tail.replace(old, new, 1)
          old = '        staff_number=staff_number,\n    )'
          new = '        staff_number=staff_number,\n        installation_file=installation_file,\n        source_root=source_root,\n    )'
          if tail.count(old) != 1:
              raise SystemExit('Entry call anchor mismatch')
          text = text[:start] + tail.replace(old, new, 1)
          source.write_text(text, encoding='utf-8', newline='\n')
          source = scripts / 'paos.py'
          if subprocess.check_output(['git', 'hash-object', str(source)], text=True).strip() != '524011230561db6f05d8ded891a6dc371f553929':
              raise SystemExit('Unexpected CLI source; stop')
          text = source.read_text(encoding='utf-8')
          old = '''            if not workflow_library or not skill_library:
                          installation = load_installation_descriptor(installation_path)
                          roots_path = resolve_library_roots_path(installation=installation)
                          roots = load_library_roots(roots_path)
                          if not workflow_library:
                              workflow_library = str(roots.get("workflow_root") or "")
                          if not skill_library:
                              skill_library = str(roots.get("skill_root") or "")'''
          new = '''            installation = load_installation_descriptor(installation_path)
                      roots_path = resolve_library_roots_path(installation=installation)
                      roots = load_library_roots(roots_path)
                      if not workflow_library:
                          workflow_library = str(roots.get("workflow_root") or "")
                      if not skill_library:
                          skill_library = str(roots.get("skill_root") or "")'''
          if text.count(old) != 1:
              raise SystemExit('CLI roots anchor mismatch')
          text = text.replace(old, new, 1)
          old = '                skill_library=skill_library,\n                staff_number=staff,\n'
          new = ('                skill_library=skill_library,\n'
                 '                tool_index_ref=str(roots.get("tool_catalog") or ""),\n'
                 '                installation_file=str(installation_path),\n'
                 '                source_root=str(installation.get("source_root") or ""),\n'
                 '                staff_number=staff,\n')
          if text.count(old) != 1:
              raise SystemExit('CLI entry arguments anchor mismatch')
          source.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY
          python -m py_compile code/personal-agent-os/scripts/paos_workstation.py code/personal-agent-os/scripts/paos.py
          git diff --check
      - name: Verify the candidate
        run: |
          python code/personal-agent-os/scripts/verify.py
          node --test tests/board-ui.test.mjs
      - name: Commit only inspected entry implementation to the candidate branch
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -eu
          branch=codex/paoe-stage1-workflow-entry-20261102
          actual=$(git ls-remote origin refs/heads/$branch | cut -f1)
          test "$actual" = "$EXPECTED_HEAD"
          git add -- code/personal-agent-os/scripts/paos.py code/personal-agent-os/scripts/paos_workstation.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: make generated Home entry expose installed CLI and resource locators'
          git push origin HEAD:refs/heads/$branch
