name: System baseline checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Core contracts
        run: python Core/code/personal-agent-os/scripts/verify.py
      - name: CAT content and recovery helpers
        run: node --test Core/tests/cat-content.test.mjs Core/tests/cat-state.test.mjs Core/tests/cat-drafts.test.mjs
      - name: Install locked frontend build dependencies
        working-directory: Core/front/ui
        run: npm ci --no-audit --no-fund
      - name: Frontend contracts and production build
        working-directory: Core/front/ui
        run: |
          npm test
          npm run build
      - name: Compiled frontend matches source
        run: git diff --exit-code -- Core/front/dist
      - name: System release and isolated upgrade contracts
        run: python -B -m unittest discover -s tests -v
